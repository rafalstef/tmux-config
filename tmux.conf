set -g @background "#010409"
set -g @foreground "#f0f6fc"
set -g @dimmed "#8b949e"
set -g @accent_bright "#2f81f7"
set -g @green "#238636"
set -g @green_bright "#3fb950"
set -g @black "#0d1117"
set -g @border "#30363d"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Prefix
set -g prefix C-Space

# Mouse
set -g mouse on

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status bar
set -g status-style "bg=#{@background},fg=#{@foreground}"

set -g status-position top
set -g status-justify left

# Windows
set -g base-index 1
set -g pane-base-index 1

set -g window-status-style "bg=#{@background},fg=#{@dimmed}"
set -g window-status-current-style "fg=#{@foreground},bold"
set -g window-status-separator " "

set -g window-status-format " #I: #W "
set -g window-status-current-format " #I: #W "

# Panes
set -g pane-border-style "fg=#{@border}"
set -g pane-active-border-style "fg=#{@foreground}"

# Messages
set -g message-style "bg=#{@black},fg=#{@foreground}"

# Copy mode
set -g copy-mode-match-style "bg=#{@green},fg=#{@foreground}"
set -g copy-mode-current-match-style "bg=#{@green_bright},fg=#{@black}"

# Status left
set -g status-left "#{?client_prefix,#[bg=#{@accent_bright}],}#[fg=#{@foreground},bold] #S #[bg=#{@background},fg=#{@foreground}]"

# Status right
set -g status-right "#[bg=#{@background},fg=#{@foreground}] %H:%M #[fg=#{@dimmed},bold] %Y-%m-%d "
